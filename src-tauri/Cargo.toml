[package]
name = "repertica-studio"
version = "0.1.5"
description = "Local-first open source artwork management"
authors = ["Repertica contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "repertica_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads the identifier of this build (tauri.conf.json plus the `--config` override).
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
sha2 = "0.10"
imap = "2.4.1"
native-tls = "0.2"
mailparse = "0.15"
html2text = "0.15.3"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "native-tls", "hostname"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-os = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
# Optional Auctions connection (auction_online.rs): same reqwest/rustls build as tauri-plugin-updater.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
