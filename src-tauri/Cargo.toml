[package]
name = "repertica-studio"
version = "0.1.0"
description = "Local-first open source artwork management"
authors = ["Repertica contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "repertica_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
