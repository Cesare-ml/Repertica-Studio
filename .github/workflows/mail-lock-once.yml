name: One-off mail dependency lock refresh
on:
  push:
    branches: [feat/desktop-business-mail-imap-smtp]
permissions:
  contents: write
jobs:
  lock:
    if: "${{ !contains(github.event.head_commit.message, '[mail-lock-complete]') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve Cargo dependency lockfile
        run: cargo update --manifest-path src-tauri/Cargo.toml --workspace
      - name: Commit changed lockfile once
        shell: bash
        run: |
          if ! git diff --quiet -- src-tauri/Cargo.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src-tauri/Cargo.lock
            git commit -m 'chore(mail): refresh Cargo.lock [mail-lock-complete]'
            git push origin HEAD:feat/desktop-business-mail-imap-smtp
          fi
