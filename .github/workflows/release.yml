# Signed Windows releases (installer + latest.json). macOS is intentionally not published.
# Push a matching vX.Y.Z tag, or manually rerun an existing tag from Actions > Release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to build (example: v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: repertica-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check release version and signing keys
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Checkout the exact version being published
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          persist-credentials: false

      # Allows safe repair of release tooling without moving/rewriting existing tags.
      - name: Checkout the latest key normalization tool
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-tools
          persist-credentials: false

      - name: Verify tag, versions and available key material
        id: validate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          PUBLIC_KEY: ${{ vars.REPERTICA_UPDATER_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::Release tag must be a semantic version such as v0.1.0"
            exit 1
          }
          version="${RELEASE_TAG#v}"
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          crate="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          echo "tag=$version tauri.conf=$app package.json=$pkg Cargo.toml=$crate"
          test "$version" = "$app" && test "$version" = "$pkg" && test "$version" = "$crate" || {
            echo "::error::Release tag and source code versions do not match"
            exit 1
          }
          test -n "$PUBLIC_KEY" || { echo "::error::REPERTICA_UPDATER_PUBLIC_KEY is missing"; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is missing"; exit 1; }
          # Do not print or publish the key; reject wrong formats before compiling Rust.
          node .release-tools/scripts/normalize-updater-public-key.mjs --check
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish:
    name: Windows x64 installer
    needs: check
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Checkout the immutable release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false
      - name: Checkout public updater key tooling
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-tools
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm install --no-audit --no-fund
      - run: npm run prepare:icons
      - name: Normalize the release public key and patch Tauri config
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.REPERTICA_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node .release-tools/scripts/normalize-updater-public-key.mjs --write

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # REPERTICA_UPDATER_PUBLIC_KEY is set to the *normalized* value via GITHUB_ENV.
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: 'Repertica Studio ${{ needs.check.outputs.tag }}'
          releaseBody: 'Release Windows di Repertica Studio. Consultare README e note di rilascio prima di utilizzare archivi importanti.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: npx tauri
          args: --config src-tauri/tauri.release.conf.json
