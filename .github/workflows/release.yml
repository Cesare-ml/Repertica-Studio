# Publishes a signed release for Windows and macOS (Apple Silicon and Intel): installers plus the
# `latest.json` feed read by the in-app updater.
# Start it by pushing a tag such as `v0.2.0`, or run it by hand with the name of an existing tag to add
# builds to that release (see docs/RELEASING.md for the one-time key setup).
# The private signing key lives only in the repository secrets; the public key is a repository variable.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to its release (for example v0.1.1)'
        required: true
        type: string
      only_macos:
        description: 'Build only the macOS packages (the Windows ones are already in the release)'
        required: false
        default: false
        type: boolean
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: write
concurrency:
  group: repertica-release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false
jobs:
  check:
    name: Check version and keys
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: The tag, the app version and the signing setup must agree
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.REPERTICA_UPDATER_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG#v}"
          app="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          crate="$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version *= *"([^"]+)"/\1/')"
          echo "tag=$tag tauri.conf=$app package.json=$pkg Cargo.toml=$crate"
          test "$tag" = "$app" && test "$tag" = "$pkg" && test "$tag" = "$crate" || { echo "::error::The tag does not match the version in tauri.conf.json, package.json and Cargo.toml"; exit 1; }
          test -n "$PUBLIC_KEY" || { echo "::error::Repository variable REPERTICA_UPDATER_PUBLIC_KEY is not set"; exit 1; }
          test -n "$PRIVATE_KEY" || { echo "::error::Repository secret TAURI_SIGNING_PRIVATE_KEY is not set"; exit 1; }
      - name: Choose the platforms to build
        id: plan
        shell: bash
        env:
          ONLY_MACOS: ${{ inputs.only_macos }}
        run: |
          set -euo pipefail
          windows='{"name":"Windows","runner":"windows-latest","args":"","target":""}'
          arm='{"name":"macOS Apple Silicon","runner":"macos-15","args":"--target aarch64-apple-darwin","target":"aarch64-apple-darwin"}'
          intel='{"name":"macOS Intel","runner":"macos-15-intel","args":"--target x86_64-apple-darwin","target":"x86_64-apple-darwin"}'
          if [ "$ONLY_MACOS" = "true" ]; then list="$arm,$intel"; else list="$windows,$arm,$intel"; fi
          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
          echo "Building: $list"
  publish:
    name: ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # One at a time: every job merges its platform into the same latest.json.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: '0'
      # macOS apps are ad-hoc signed (no Apple Developer ID); the update packages are minisign-signed.
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:icons
      - name: Add the public key to the release configuration
        # The bundler reads the key from the configuration (the Rust build reads it from the environment).
        shell: bash
        env:
          PUBLIC_KEY: ${{ vars.REPERTICA_UPDATER_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            const file = 'src-tauri/tauri.release.conf.json';
            const config = JSON.parse(fs.readFileSync(file, 'utf8'));
            const key = (process.env.PUBLIC_KEY || '').trim();
            if (!key) throw new Error('REPERTICA_UPDATER_PUBLIC_KEY is empty');
            config.plugins = { updater: { pubkey: key } };
            fs.writeFileSync(file, JSON.stringify(config, null, 2));
          "
      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REPERTICA_UPDATER_PUBLIC_KEY: ${{ vars.REPERTICA_UPDATER_PUBLIC_KEY }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'Repertica Studio ${{ env.RELEASE_TAG }}'
          releaseBody: 'Vedi le note di rilascio e il file CHANGELOG per le novità di questa versione.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          # The project has no `tauri` npm script (only tauri:dev / tauri:build), so call the CLI directly.
          tauriScript: npx tauri
          # The extra config only switches on the signed update packages, which need the private key.
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
