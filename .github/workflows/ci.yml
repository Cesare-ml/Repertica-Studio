name: MVP checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:unit
      - name: Real PostgreSQL local export (disposable cluster)
        run: |
          set -eu
          pg_bin="$(find /usr/lib/postgresql -path '*/bin/initdb' -type f | sort -V | tail -n 1)"
          test -n "$pg_bin"
          export PATH="$(dirname "$pg_bin"):$PATH"
          node --test tests/gestionale-postgres.integration.mjs
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:icons
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: PostgreSQL export to native SQLite import, backup and restore
        run: |
          set -eu
          pg_bin="$(find /usr/lib/postgresql -path '*/bin/initdb' -type f | sort -V | tail -n 1)"
          test -n "$pg_bin"
          export PATH="$(dirname "$pg_bin"):$PATH"
          REPERTICA_TEST_NATIVE_ROUNDTRIP=1 node --test tests/gestionale-postgres.integration.mjs
  # Windows has different filesystem semantics (open handles block directory renames,
  # canonical paths use the \\?\ prefix); backup and restore must be tested there too.
  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install --no-audit --no-fund
      - run: npm run prepare:icons
      - run: cargo test --manifest-path src-tauri/Cargo.toml
